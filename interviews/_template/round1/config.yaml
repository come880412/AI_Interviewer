# ===== This round's settings: rename round1 to the round, e.g. tech or hm =====
interviewer_name: Alex
interviewer_title: Engineering Manager
round_name: technical screen
duration_minutes: 45             # length in minutes; drives the time checks and resuming after a dropped connection
difficulty: standard            # standard or tough
# interview_language: zh-TW     # English if left out. Also ja, es, fr, it, pt-BR, hi; each uses that language's
#                               # Kokoro voices (zh-TW: zm_010..., ja: jm_kumo...; see docs/reference.md)

# ===== Voice (Kokoro's built-in voices) =====
# American male: am_michael, am_adam, am_eric, am_liam, am_onyx, am_fenrir, am_puck, am_echo
# British male: bm_george, bm_lewis, bm_daniel, bm_fable (set voice_language to en-gb for these)
voice: am_michael
voice_language: en-us

# ===== Voice cloning (Pocket TTS, runs on the CPU) =====
# Set this to use the voice in a reference recording instead of Kokoro's voice.
# Only clone the voice of someone who has agreed to it.
# voice_clone: voice/reference.wav
# Or one of Pocket TTS's built-in voices (no recording needed): stuart_bell, javert, michael, paul, charles, ...
# pocket_voice: stuart_bell

# ===== Video interviewer (the /interview page) =====
# avatar: david                  # a GLB in web/avatars/: david (male look) or brunette (female look)
# avatar_body: M                 # M or F, to match the avatar

# ===== Coding interview defaults (optional): what the setup page preselects for this round =====
# coding:
#   language: python             # python or cpp
#   difficulties: [medium, hard]
#   tags: [graph, tree]
#   minutes: 45                  # 15, 30, 45 or 60
#
# To change how the interviewer behaves for this round only, put your own interviewer.md, feedback.md or
# coding_rubric.md in a prompts/ folder here (start from a copy of the shared one in prompts/).
