# ===== Company settings: copy the whole _template folder and name it after the company, e.g. interviews/acme =====
# This level holds what every round at this company shares: company.yaml, jd.md, company_info.md, and
# optionally a resume.md for this company only (otherwise profile/resume.md is used; you can also upload a
# resume for "all rounds of this company" on the setup page).
# Each round is a subfolder (rename round1/ to tech/, hm/, ...) with its config.yaml, round_info.md and question_bank.md.
company: Acme
role_title: Computer Vision Engineer
feedback_language: English   # language of the report, e.g. English or Traditional Chinese (Taiwan)

# ===== Speech recognition hints =====
# Only terms from the JD that are genuinely easy to mishear. With a long list, Whisper tends to read the list
# back when it can't hear you clearly. Each round's config.yaml can add its own; the two lists are merged.
stt_hotwords:
  - Acme
