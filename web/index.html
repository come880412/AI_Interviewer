<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>模擬面試</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  /* Two columns: the start panel stays in view on the left, everything else lives in tabs on the right. */
  main { max-width: 1240px; gap: 20px; padding-bottom: 48px; }
  .top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 20px; }
  .top .nav { margin: 0; }
  .layout { display: grid; grid-template-columns: minmax(300px, 380px) minmax(0, 1fr); gap: 20px; align-items: start; }
  /* Let long option text and rows shrink instead of widening the page. */
  .layout > *, .start > *, .field-group > * { min-width: 0; }
  .start { position: sticky; top: 16px; display: grid; gap: 16px; padding: 18px; }
  .start h2, .panel-title { margin: 0; font-size: 13px; color: var(--muted); font-weight: 500; letter-spacing: 0.04em; }
  .field-group { display: grid; gap: 6px; }
  .start select, .start input[type="text"] { width: 100%; }
  .interview-meta { font-size: 13px; color: var(--muted); line-height: 1.5; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 3px; gap: 3px; }
  .seg button { background: transparent; color: var(--muted); padding: 7px 4px; font-size: 13px; border-radius: 6px; }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
  .seg button:disabled { opacity: 0.4; }
  .mode-detail { display: grid; gap: 10px; font-size: 13px; color: var(--muted); }
  .two { display: grid; grid-template-columns: 1fr 96px; gap: 8px; }
  .latest { border-top: 1px solid var(--line); padding-top: 14px; display: grid; gap: 8px; }
  .latest-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 13px; }
  .area-scores { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-size: 13px; }
  .go { width: 100%; padding: 12px; font-size: 15px; }
  #go-error { font-size: 13px; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
  .tabs button { background: none; color: var(--muted); border-radius: 0; padding: 9px 14px; border-bottom: 2px solid transparent; margin-bottom: -1px; font-weight: 500; }
  .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  .history { display: grid; }
  .row { display: grid; grid-template-columns: 128px minmax(0, 1fr) auto; gap: 4px 14px; align-items: center; padding: 10px 4px; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row.picked { background: var(--accent-soft); border-radius: 8px; }
  .row .when { font-size: 13px; font-variant-numeric: tabular-nums; }
  .row .what { min-width: 0; }
  .row .what .line1 { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 14px; }
  .row .what .line2 { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .acts { display: flex; flex-wrap: wrap; gap: 4px 12px; justify-content: flex-end; font-size: 13px; }
  .row .acts button { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 400; font-size: 13px; text-decoration: underline; }
  .row .acts button.resume-btn { text-decoration: none; border: 1px solid var(--accent); border-radius: 6px; padding: 2px 8px; }
  .history-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
  #resume-text { min-height: 340px; }
  .wizard-drafts textarea { min-height: 180px; }
  @media (max-width: 900px) {
    .layout { grid-template-columns: minmax(0, 1fr); }
    .start { position: static; }
    .row { grid-template-columns: minmax(0, 1fr); }
    .row .acts { justify-content: flex-start; }
  }
</style>
</head>
<body>
<main>
  <header class="top">
    <h1>模擬面試</h1>
    <div class="nav">
      <a href="/notepad" target="_blank" rel="noopener">共用筆記板</a>
      <a href="#" id="progress-link">練習進度</a>
    </div>
  </header>

  <div class="banner" id="active-banner" hidden>
    <span id="active-text"></span>
    <span class="actions">
      <a href="/interview" target="_blank" rel="noopener">回到面試頁</a>
      <button type="button" class="danger" id="end-btn">結束並產生報告</button>
    </span>
  </div>

  <div class="layout">
    <!-- Left: everything needed to start a session -->
    <section class="card start" aria-labelledby="start-title">
      <h2 id="start-title">開始練習</h2>

      <div class="field-group">
        <label class="meta" for="interview-select">面試</label>
        <select id="interview-select"></select>
        <div class="interview-meta" id="interview-meta"></div>
        <div id="issues-box"></div>
      </div>

      <div class="field-group">
        <span class="meta">練習方式</span>
        <div class="seg" role="group" aria-label="練習方式">
          <button type="button" data-mode="full" aria-pressed="true">完整面試</button>
          <button type="button" data-mode="drill" aria-pressed="false">專項練習</button>
          <button type="button" data-mode="resume" aria-pressed="false">接續</button>
        </div>
        <div class="mode-detail" id="mode-full"></div>
        <div class="mode-detail" id="mode-drill" hidden>
          <div class="two">
            <select id="drill-topic" aria-label="練習主題"></select>
            <select id="drill-minutes" aria-label="練習時間">
              <option value="10">10 分鐘</option>
              <option value="15" selected>15 分鐘</option>
              <option value="20">20 分鐘</option>
              <option value="30">30 分鐘</option>
            </select>
          </div>
          <input type="text" id="drill-custom" placeholder="自訂主題，例如：epipolar geometry 與深度誤差" hidden aria-label="自訂主題">
          <span>跳過自我介紹，只針對這個主題由淺入深地問。</span>
        </div>
        <div class="mode-detail" id="mode-resume" hidden>
          <select id="resume-select" aria-label="要接續的逐字稿"></select>
          <span id="resume-hint"></span>
        </div>
      </div>

      <div class="latest" id="latest" hidden></div>

      <div class="field-group">
        <button type="button" class="go" id="go" disabled>前往面試</button>
        <span class="error" id="go-error" hidden></span>
      </div>
    </section>

    <!-- Right: history, resume, and new interviews -->
    <section>
      <div class="tabs" role="tablist">
        <button type="button" role="tab" id="tab-history" aria-selected="true" aria-controls="panel-history">練習紀錄</button>
        <button type="button" role="tab" id="tab-resume" aria-selected="false" aria-controls="panel-resume">履歷</button>
        <button type="button" role="tab" id="tab-setup" aria-selected="false" aria-controls="panel-setup">新增公司或關卡</button>
      </div>

      <div role="tabpanel" id="panel-history" aria-labelledby="tab-history">
        <div class="card">
          <div class="history" id="history"></div>
        </div>
      </div>

      <div role="tabpanel" id="panel-resume" aria-labelledby="tab-resume" hidden>
        <div class="card">
          <div id="resume-current" class="meta"></div>
          <div class="actions">
            <label class="file-label"><input type="file" id="resume-file" accept=".pdf,.docx,.txt,.md"><span>上傳新履歷</span></label>
            <button type="button" class="secondary" id="resume-edit">編輯目前履歷</button>
            <span class="status" id="resume-status"></span>
          </div>
          <div id="resume-editor" hidden>
            <div style="display: grid; gap: 10px;">
              <p class="status">請檢查內容和原檔一致再儲存。舊版本會備份到 profile/backups/，下一次開始面試時生效。</p>
              <textarea id="resume-text" spellcheck="false" aria-label="履歷內容"></textarea>
              <div class="actions">
                <label for="resume-target" class="meta">存到</label>
                <select id="resume-target"></select>
              </div>
              <div class="actions">
                <button type="button" id="resume-save">儲存履歷</button>
                <button type="button" class="secondary" id="resume-cancel">取消</button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div role="tabpanel" id="panel-setup" aria-labelledby="tab-setup" hidden>
        <div class="card">
          <p class="meta" style="margin:0">貼上 JD 和你知道的這一關資訊，讓 Claude 起草題庫、評分標準和面試官設定。</p>
          <label class="field">公司
            <select id="w-company"></select>
          </label>
          <div class="grid2" id="w-new-company">
            <label class="field">公司名稱<input type="text" id="w-company-name" placeholder="Acme"></label>
            <label class="field">職缺名稱<input type="text" id="w-role" placeholder="Computer Vision Engineer"></label>
          </div>
          <div class="grid2">
            <label class="field">關卡名稱<input type="text" id="w-round" placeholder="technical screen"></label>
            <label class="field">關卡資料夾（小寫英文）<input type="text" id="w-round-slug" placeholder="tech"></label>
            <label class="field">面試官名字<input type="text" id="w-interviewer" placeholder="Alex"></label>
            <label class="field">面試官職稱<input type="text" id="w-interviewer-title" placeholder="Engineering Manager"></label>
            <label class="field">時長（分鐘）<input type="number" id="w-duration" value="45" min="5" max="180"></label>
            <label class="field">難度
              <select id="w-difficulty"><option value="standard">standard</option><option value="tough">tough</option></select>
            </label>
          </div>
          <label class="field" id="w-jd-box">職缺描述（JD）<textarea id="w-jd" rows="8"></textarea></label>
          <label class="field">這一關的資訊（HR 的說明、面試官背景、你聽說的題型）<textarea id="w-notes" rows="5"></textarea></label>
          <div class="actions">
            <button type="button" id="w-draft">產生草稿</button>
            <span class="status" id="w-status"></span>
          </div>
          <div class="wizard-drafts" id="w-drafts" hidden>
            <div style="display: grid; gap: 12px;">
              <p class="status">檢查並修改草稿，再按「建立」。不想要的段落可以清空。</p>
              <label class="field">round_info.md（這關考什麼、面試官風格）<textarea id="w-round_info"></textarea></label>
              <label class="field">question_bank.md（題庫）<textarea id="w-question_bank"></textarea></label>
              <label class="field">rubric.md（評分標準，用 ## 標出每個面向）<textarea id="w-rubric"></textarea></label>
              <label class="field" id="w-company-info-box">company_info.md（回答你的提問時可用的公司資訊）<textarea id="w-company_info"></textarea></label>
              <label class="field">Whisper 提示詞（一行一個）<textarea id="w-hotwords" rows="6"></textarea></label>
              <div class="actions">
                <button type="button" id="w-create">建立</button>
                <span class="status" id="w-create-status"></span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
</main>

<script>
(function () {
  var data = null;
  // mode: "full", "drill" or "resume"; resume holds the transcript file name to continue.
  var state = { interview: null, mode: "full", resume: null };
  var lastStatus = "";
  var verdicts = { "hire": "錄取", "lean hire": "傾向錄取", "lean no": "傾向不錄取", "no": "不錄取" };
  var $ = function (id) { return document.getElementById(id); };

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function api(url, body) {
    var opts = body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) };
    return fetch(url, opts).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok) throw new Error(j.detail || r.statusText);
        return j;
      });
    });
  }

  function current() { return data.interviews.find(function (i) { return i.name === state.interview; }); }
  function hasErrors(iv) { return iv.issues.some(function (i) { return i.level === "error"; }); }
  function sessionLabel(s) { return s.mode === "drill" ? "專項：" + s.topic : "完整面試"; }
  // Transcripts worth continuing: no report yet and not running right now.
  function resumable(iv) { return iv.transcripts.filter(function (t) { return !t.has_feedback && !t.active; }); }

  // ----- Tabs -----
  var tabs = ["history", "resume", "setup"];
  function showTab(name) {
    tabs.forEach(function (t) {
      $("tab-" + t).setAttribute("aria-selected", String(t === name));
      $("panel-" + t).hidden = t !== name;
    });
    try { localStorage.setItem("setup-tab", name); } catch (e) {}
  }
  tabs.forEach(function (t) { $("tab-" + t).addEventListener("click", function () { showTab(t); }); });
  try { if (tabs.indexOf(localStorage.getItem("setup-tab")) >= 0) showTab(localStorage.getItem("setup-tab")); } catch (e) {}

  // ----- Active session -----
  function renderActive() {
    var a = data.active;
    $("active-banner").hidden = !a;
    if (!a) return;
    var mins = Math.max(0, Math.round((Date.now() / 1000 - a.started) / 60));
    $("active-text").textContent = "面試進行中：" + a.interview + " · " + sessionLabel(a.session) + " · 已進行約 " + mins + " / " + a.minutes + " 分鐘";
  }

  var endArmed = false;
  $("end-btn").addEventListener("click", function () {
    var btn = this;
    if (!endArmed) {
      endArmed = true;
      btn.textContent = "確定結束？再按一次";
      setTimeout(function () { endArmed = false; btn.textContent = "結束並產生報告"; }, 4000);
      return;
    }
    btn.disabled = true;
    api("/api/session/end", {}).then(function () {
      $("active-text").textContent = "已結束，正在產生回饋報告…";
    }).catch(function (err) {
      $("active-text").textContent = err.message;
    }).finally(function () { endArmed = false; btn.disabled = false; btn.textContent = "結束並產生報告"; });
  });

  // ----- Start panel -----
  function renderInterviewSelect() {
    var select = $("interview-select");
    select.replaceChildren();
    data.interviews.forEach(function (iv) {
      var o = el("option", null, iv.company + " · " + iv.name.split("/").pop() + (hasErrors(iv) ? "（設定有問題）" : ""));
      o.value = iv.name;
      select.append(o);
    });
    var add = el("option", null, "＋ 新增公司或關卡…");
    add.value = "__new";
    select.append(add);
    select.value = state.interview;
    var iv = current();
    var parts = [iv.role, iv.round, iv.interviewer, iv.duration ? iv.duration + " 分鐘" : ""].filter(Boolean);
    $("interview-meta").textContent = parts.join(" · ");

    var box = $("issues-box");
    box.replaceChildren();
    if (iv.issues.length) {
      var errors = iv.issues.filter(function (i) { return i.level === "error"; }).length;
      var d = el("details");
      d.open = errors > 0;
      d.append(el("summary", errors ? "error" : "meta", errors ? "設定有 " + errors + " 個錯誤，修正後才能開始" : "設定提醒（" + iv.issues.length + "）"));
      var ul = el("ul", "issues");
      iv.issues.forEach(function (i) { ul.append(el("li", i.level, i.message)); });
      d.append(ul);
      box.append(d);
    }
  }

  function renderMode() {
    var iv = current();
    var resumes = resumable(iv);
    document.querySelectorAll(".seg button").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.mode === state.mode));
      if (b.dataset.mode === "resume") {
        b.disabled = !iv.transcripts.some(function (t) { return !t.active; });
      }
    });
    $("mode-full").hidden = state.mode !== "full";
    $("mode-drill").hidden = state.mode !== "drill";
    $("mode-resume").hidden = state.mode !== "resume";
    $("mode-full").textContent = "從開場、經歷、技術題到你的提問，約 " + iv.duration + " 分鐘。";

    // Drill topics: what the last reports suggested first, then the rubric areas, then a custom topic.
    var select = $("drill-topic");
    var keep = select.value;
    select.replaceChildren();
    var suggested = iv.suggested_topics || [];
    if (suggested.length) {
      var g1 = el("optgroup"); g1.label = "上次建議加強";
      suggested.forEach(function (t) { var o = el("option", null, t); o.value = t; g1.append(o); });
      select.append(g1);
    }
    var areas = (iv.drill_topics || []).filter(function (t) { return suggested.indexOf(t) < 0; });
    if (areas.length) {
      var g2 = el("optgroup"); g2.label = "評分面向";
      areas.forEach(function (t) { var o = el("option", null, t); o.value = t; g2.append(o); });
      select.append(g2);
    }
    var custom = el("option", null, "自訂主題…"); custom.value = "__custom";
    select.append(custom);
    if (keep && Array.from(select.options).some(function (o) { return o.value === keep; })) select.value = keep;
    $("drill-custom").hidden = select.value !== "__custom";

    // Transcripts to continue: unfinished ones first.
    var rs = $("resume-select");
    rs.replaceChildren();
    var choices = resumes.concat(iv.transcripts.filter(function (t) { return t.has_feedback && !t.active; }));
    choices.forEach(function (t) {
      var o = el("option", null, t.started + " · " + sessionLabel(t.session) + " · " + (t.has_feedback ? "已有報告" : "中斷 " + t.minutes + "/" + t.planned_minutes + " 分"));
      o.value = t.file;
      rs.append(o);
    });
    if (state.mode === "resume") {
      if (!state.resume || !choices.some(function (t) { return t.file === state.resume; })) state.resume = choices.length ? choices[0].file : null;
      rs.value = state.resume || "";
      var t = choices.find(function (c) { return c.file === state.resume; });
      $("resume-hint").textContent = t && t.last_question ? "最後一題：" + t.last_question : "";
    }
    renderGo();
  }

  function drillTopic() {
    var v = $("drill-topic").value;
    return v === "__custom" ? $("drill-custom").value.trim() : v;
  }

  function renderLatest() {
    var iv = current();
    var box = $("latest");
    box.replaceChildren();
    box.hidden = !iv.latest;
    if (!iv.latest) return;
    var head = el("div", "latest-head");
    head.append(el("span", "meta", "最近一場 · " + iv.latest.started + " · " + sessionLabel(iv.latest.session)));
    var link = el("a", null, "練習進度 →");
    link.href = "/progress?interview=" + encodeURIComponent(iv.name);
    head.append(link);
    box.append(head);
    if (iv.latest.verdict) box.append(el("div", null, "判定：" + (verdicts[iv.latest.verdict] || iv.latest.verdict)));
    var grid = el("div", "area-scores");
    iv.latest.areas.filter(function (a) { return a.score != null; }).forEach(function (a) {
      grid.append(el("span", null, a.name));
      grid.append(el("span", "score s" + Math.round(a.score), String(a.score)));
    });
    box.append(grid);
  }

  function renderGo() {
    var iv = current();
    var blocked = hasErrors(iv) || (state.mode === "resume" && !state.resume) || (state.mode === "drill" && !drillTopic());
    $("go").disabled = blocked;
    $("go").textContent = state.mode === "resume" ? "前往面試（接續）" : state.mode === "drill" ? "前往面試（專項練習）" : "前往面試";
    $("go-error").hidden = true;
    $("progress-link").href = "/progress?interview=" + encodeURIComponent(iv.name);
  }

  document.querySelectorAll(".seg button").forEach(function (b) {
    b.addEventListener("click", function () {
      state.mode = b.dataset.mode;
      renderMode();
      renderHistory();
    });
  });
  $("interview-select").addEventListener("change", function () {
    if (this.value === "__new") {
      // Not an interview: open the wizard and keep the current interview selected.
      this.value = state.interview;
      showTab("setup");
      $("panel-setup").scrollIntoView({ behavior: "smooth", block: "start" });
      $("w-company").focus();
      return;
    }
    state.interview = this.value;
    state.mode = "full";
    state.resume = null;
    render();
  });
  $("drill-topic").addEventListener("change", function () { $("drill-custom").hidden = this.value !== "__custom"; renderGo(); });
  $("drill-custom").addEventListener("input", renderGo);
  $("resume-select").addEventListener("change", function () { state.resume = this.value; renderMode(); renderHistory(); });

  $("go").addEventListener("click", function () {
    var body = { interview: state.interview, mode: "full" };
    if (state.mode === "drill") {
      body.mode = "drill";
      body.topic = drillTopic();
      body.minutes = parseInt($("drill-minutes").value, 10);
    } else if (state.mode === "resume") {
      body.resume = state.resume;
    }
    $("go").disabled = true;
    api("/api/selection", body).then(function () {
      location.href = "/interview";
    }).catch(function (err) {
      $("go-error").textContent = "沒有設定成功：" + err.message;
      $("go-error").hidden = false;
      $("go").disabled = false;
    });
  });

  // ----- History -----
  function statusChip(t) {
    if (t.active) return el("span", "chip info", "進行中");
    if (t.generating) return el("span", "chip info", "報告產生中");
    if (t.has_feedback) return el("span", "chip done", "有報告");
    return el("span", "chip cut", "中斷");
  }

  function renderHistory() {
    var iv = current();
    var box = $("history");
    box.replaceChildren();
    if (!iv.transcripts.length) {
      box.append(el("p", "empty", "還沒有練習紀錄。在左邊選好方式，按「前往面試」開始第一場。"));
      return;
    }
    iv.transcripts.forEach(function (t) {
      var row = el("div", "row" + (state.mode === "resume" && state.resume === t.file ? " picked" : ""));
      row.append(el("span", "when", t.started));

      var what = el("div", "what");
      var line1 = el("div", "line1");
      line1.append(el("span", null, sessionLabel(t.session)), statusChip(t),
                   el("span", "meta", t.minutes + " / " + t.planned_minutes + " 分 · " + t.turns + " 段"));
      what.append(line1);
      if (t.last_question) what.append(el("div", "line2", "最後一題：" + t.last_question));
      if (t.report_error) what.append(el("div", "error", "上次產生失敗：" + t.report_error));
      row.append(what);

      var acts = el("div", "acts");
      var base = "/report?interview=" + encodeURIComponent(iv.name) + "&file=" + encodeURIComponent(t.file);
      if (t.has_feedback) {
        var a = el("a", null, "報告"); a.href = base; a.target = "_blank"; a.rel = "noopener"; acts.append(a);
      }
      var tr = el("a", null, "逐字稿"); tr.href = base + "&kind=transcript"; tr.target = "_blank"; tr.rel = "noopener"; acts.append(tr);
      // Finished sessions only need their report; interrupted ones can get a report or be continued.
      if (!t.active && !t.generating && !t.has_feedback) {
        var gen = el("button", null, "產生報告");
        gen.type = "button";
        gen.addEventListener("click", function () {
          gen.disabled = true;
          api("/api/feedback", { interview: iv.name, file: t.file }).then(function () {
            t.generating = true;
            renderHistory();
          }).catch(function (err) { gen.textContent = err.message; });
        });
        acts.append(gen);
        var cont = el("button", "resume-btn", "接續");
        cont.type = "button";
        cont.title = "在左邊設定成接續這一場";
        cont.addEventListener("click", function () {
          state.mode = "resume";
          state.resume = t.file;
          renderMode();
          renderHistory();
          $("go").focus();
        });
        acts.append(cont);
      }
      row.append(acts);
      box.append(row);
    });
  }

  function render() {
    renderActive();
    renderInterviewSelect();
    renderMode();
    renderLatest();
    renderHistory();
    renderResume();
  }

  // ----- Resume -----
  function layerLabel(iv, layer) {
    if (layer.level === "interview") return "只用在這一關（" + (iv.round || iv.name) + "）";
    if (layer.level === "company") return iv.company + " 的所有關卡";
    return "所有公司共用";
  }
  function inUseLayer(iv) { return iv.resume_layers.find(function (l) { return l.in_use; }); }
  // New uploads go to the company version by default, since resumes are usually tailored per company.
  function defaultLayer(iv) {
    return iv.resume_layers.find(function (l) { return l.level === "company"; }) || iv.resume_layers[0];
  }
  function setResumeStatus(text, cls) {
    $("resume-status").textContent = text;
    $("resume-status").className = "status" + (cls ? " " + cls : "");
  }

  function renderResume() {
    var iv = current();
    if (!iv.resume_layers.length) { $("resume-current").textContent = "請先修正這個面試的設定。"; return; }
    var used = inUseLayer(iv);
    var company = iv.resume_layers.find(function (l) { return l.level === "company"; });
    if (!used) {
      $("resume-current").textContent = "還沒有履歷。上傳一份 PDF、Word 或文字檔，系統會轉成 resume.md。";
    } else {
      var text = "目前使用：" + layerLabel(iv, used) + " · " + used.path + "（" + used.first_line + "，更新於 " + used.updated + "）";
      if (company && !company.exists) text += "。還沒有 " + iv.company + " 專用的版本，上傳時預設存成這家公司專用。";
      $("resume-current").textContent = text;
    }
    var select = $("resume-target");
    select.replaceChildren();
    iv.resume_layers.forEach(function (layer) {
      var opt = el("option", null, layerLabel(iv, layer) + "（" + layer.path + "）");
      opt.value = layer.target;
      select.append(opt);
    });
    select.value = defaultLayer(iv).target;
  }

  function openEditor(text) {
    $("resume-text").value = text;
    $("resume-editor").hidden = false;
    $("resume-text").focus();
  }

  $("resume-file").addEventListener("change", function () {
    var input = this;
    var file = input.files[0];
    if (!file) return;
    var form = new FormData();
    form.append("file", file);
    $("resume-editor").hidden = true;
    $("resume-target").value = defaultLayer(current()).target;
    setResumeStatus("正在讀取「" + file.name + "」並整理格式，大約需要一分鐘…");
    fetch("/api/resume/convert", { method: "POST", body: form }).then(function (r) {
      return r.json().then(function (j) { if (!r.ok) throw new Error(j.detail || r.statusText); return j; });
    }).then(function (j) {
      setResumeStatus("轉換完成，請檢查下面的內容。");
      openEditor(j.text);
    }).catch(function (err) {
      setResumeStatus(err.message, "error");
    }).finally(function () { input.value = ""; });
  });
  $("resume-edit").addEventListener("click", function () {
    var target = (inUseLayer(current()) || defaultLayer(current())).target;
    api("/api/resume?target=" + encodeURIComponent(target)).then(function (j) {
      setResumeStatus("");
      $("resume-target").value = target;
      openEditor(j.text);
    });
  });
  $("resume-cancel").addEventListener("click", function () { $("resume-editor").hidden = true; setResumeStatus(""); });
  $("resume-save").addEventListener("click", function () {
    var btn = this;
    btn.disabled = true;
    api("/api/resume", { target: $("resume-target").value, text: $("resume-text").value }).then(function () {
      $("resume-editor").hidden = true;
      setResumeStatus("已儲存。", "ok");
      return load();
    }).catch(function (err) {
      setResumeStatus("沒有儲存成功：" + err.message, "error");
    }).finally(function () { btn.disabled = false; });
  });

  // ----- Setup wizard -----
  var companies = [];
  function existingCompany() { return companies.find(function (c) { return c.slug === $("w-company").value; }); }
  function renderWizardCompany() {
    var c = existingCompany();
    $("w-new-company").hidden = !!c;
    $("w-jd-box").hidden = !!c;
    $("w-company-info-box").hidden = !!c;
  }
  function loadCompanies() {
    return api("/api/companies").then(function (j) {
      companies = j.companies;
      var select = $("w-company");
      select.replaceChildren();
      var fresh = el("option", null, "新的公司"); fresh.value = "";
      select.append(fresh);
      companies.forEach(function (c) {
        var o = el("option", null, c.company + "（加一關到 interviews/" + c.slug + "/，現有：" + (c.rounds.join("、") || "無") + "）");
        o.value = c.slug;
        select.append(o);
      });
      renderWizardCompany();
    });
  }
  $("w-company").addEventListener("change", renderWizardCompany);
  $("w-round").addEventListener("input", function () {
    $("w-round-slug").placeholder = this.value.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "tech";
  });
  function wizardFields() {
    var c = existingCompany();
    return {
      company_slug: c ? c.slug : "",
      company: c ? c.company : $("w-company-name").value.trim(),
      role_title: c ? c.role_title : $("w-role").value.trim(),
      feedback_language: c ? c.feedback_language : "Traditional Chinese (Taiwan)",
      round_name: $("w-round").value.trim(),
      round_slug: $("w-round-slug").value.trim() || $("w-round-slug").placeholder,
      interviewer_name: $("w-interviewer").value.trim(),
      interviewer_title: $("w-interviewer-title").value.trim(),
      duration_minutes: parseInt($("w-duration").value, 10) || 45,
      difficulty: $("w-difficulty").value,
      jd: c ? c.jd : $("w-jd").value,
      notes: $("w-notes").value,
    };
  }
  $("w-draft").addEventListener("click", function () {
    var btn = this;
    btn.disabled = true;
    $("w-status").textContent = "Claude 正在起草，大約需要一到兩分鐘…";
    $("w-status").className = "status";
    api("/api/setup/draft", wizardFields()).then(function (d) {
      ["round_info", "question_bank", "rubric", "company_info"].forEach(function (k) { $("w-" + k).value = d[k] || ""; });
      $("w-hotwords").value = (d.hotwords || []).join("\n");
      $("w-drafts").hidden = false;
      $("w-status").textContent = "草稿完成。";
      $("w-status").className = "status ok";
    }).catch(function (err) {
      $("w-status").textContent = err.message;
      $("w-status").className = "status error";
    }).finally(function () { btn.disabled = false; });
  });
  $("w-create").addEventListener("click", function () {
    var btn = this;
    var fields = wizardFields();
    ["round_info", "question_bank", "rubric", "company_info"].forEach(function (k) { fields[k] = $("w-" + k).value; });
    fields.hotwords = $("w-hotwords").value.split("\n").map(function (s) { return s.trim(); }).filter(Boolean);
    btn.disabled = true;
    api("/api/setup/create", fields).then(function (j) {
      $("w-create-status").textContent = "已建立 interviews/" + j.interview + "/，已在左邊選好。";
      $("w-create-status").className = "status ok";
      state.interview = j.interview;
      state.mode = "full";
      return Promise.all([load(), loadCompanies()]);
    }).catch(function (err) {
      $("w-create-status").textContent = err.message;
      $("w-create-status").className = "status error";
    }).finally(function () { btn.disabled = false; });
  });

  // ----- Loading and refreshing -----
  function load() {
    return api("/api/interviews").then(function (j) {
      data = j;
      if (!data.interviews.length) {
        $("interview-meta").textContent = "interviews/ 裡沒有面試。到右邊「新增公司或關卡」建立一個。";
        showTab("setup");
        return;
      }
      if (!state.interview || !current()) {
        var sel = data.selected;
        var known = sel && data.interviews.some(function (i) { return i.name === sel.interview; });
        state.interview = known ? sel.interview : data.interviews[0].name;
        if (known && sel.resume && current().transcripts.some(function (t) { return t.file === sel.resume; })) {
          state.mode = "resume";
          state.resume = sel.resume;
        } else if (known && sel.mode === "drill") {
          state.mode = "drill";
        }
      }
      render();
    });
  }

  // Refresh when a session starts or ends, or a report finishes.
  function poll() {
    api("/api/status").then(function (s) {
      var key = JSON.stringify(s);
      if (key !== lastStatus) {
        var first = lastStatus === "";
        lastStatus = key;
        if (!first) return load();
      }
      if (data && data.active) { data.active = s.active; renderActive(); }
    }).catch(function () {}).finally(function () { setTimeout(poll, 4000); });
  }

  load().then(poll).catch(function (err) { $("interview-meta").textContent = "讀取面試清單失敗：" + err.message; });
  loadCompanies().catch(function () {});
})();
</script>
</body>
</html>
