<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>練習進度</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%232f5bd3'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
<style>
  main { max-width: 1000px; }
  .trend { display: grid; gap: 14px; }
  .trend-row { display: grid; grid-template-columns: minmax(120px, 200px) minmax(0, 1fr) 40px; gap: 12px; align-items: center; }
  svg text { fill: var(--muted); font-size: 10px; }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="heading">練習進度</h1>
    <p class="lede">每一場有分數的練習。分數來自回饋報告依評分標準（rubric）打的 1–5 分。</p>
    <div class="nav"><a href="/">← 回到設定頁</a><a href="#" id="kind-link" hidden></a></div>
  </header>
  <section>
    <h2>各面向趨勢</h2>
    <div class="card trend" id="trend"></div>
  </section>
  <section>
    <h2>每一場</h2>
    <div class="card table-wrap" id="table"></div>
  </section>
</main>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var interview = params.get("interview");
  // Coding interviews are scored on their own rubric, so they get their own view.
  var kind = params.get("kind") === "coding" ? "coding" : "interview";
  var verdicts = { "hire": "錄取", "lean hire": "傾向錄取", "lean no": "傾向不錄取", "no": "不錄取" };

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function scoreChip(score) {
    if (score == null) return el("span", "meta", "—");
    return el("span", "score s" + Math.round(score), String(score));
  }

  function sparkline(values) {
    var w = 360, h = 44, pad = 6;
    var ns = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(ns, "svg");
    svg.setAttribute("viewBox", "0 0 " + w + " " + h);
    svg.setAttribute("width", "100%");
    svg.setAttribute("height", h);
    var pts = [];
    values.forEach(function (v, i) {
      if (v == null) return;
      var x = values.length === 1 ? w / 2 : pad + i * (w - 2 * pad) / (values.length - 1);
      var y = h - pad - (v - 1) * (h - 2 * pad) / 4;
      pts.push([x, y]);
    });
    [1, 3, 5].forEach(function (v) {
      var y = h - pad - (v - 1) * (h - 2 * pad) / 4;
      var line = document.createElementNS(ns, "line");
      line.setAttribute("x1", 0); line.setAttribute("x2", w);
      line.setAttribute("y1", y); line.setAttribute("y2", y);
      line.setAttribute("stroke", "var(--line)");
      svg.append(line);
    });
    if (pts.length > 1) {
      var path = document.createElementNS(ns, "polyline");
      path.setAttribute("points", pts.map(function (p) { return p.join(","); }).join(" "));
      path.setAttribute("fill", "none");
      path.setAttribute("stroke", "var(--accent)");
      path.setAttribute("stroke-width", "2");
      svg.append(path);
    }
    pts.forEach(function (p, i) {
      var c = document.createElementNS(ns, "circle");
      c.setAttribute("cx", p[0]); c.setAttribute("cy", p[1]);
      c.setAttribute("r", i === pts.length - 1 ? 4 : 2.5);
      c.setAttribute("fill", "var(--accent)");
      svg.append(c);
    });
    return svg;
  }

  if (!interview) {
    document.getElementById("trend").append(el("p", "empty", "請從設定頁點「練習進度」進來。"));
    return;
  }

  function modeLabel(s) {
    if (s.mode === "coding") {
      var parts = [{ python: "Python", cpp: "C++" }[s.language] || s.language, (s.difficulties || []).join("/")];
      if ((s.tags || []).length) parts.push(s.tags.join(", "));
      if (s.rating) parts.push("rating " + (s.rating[0] == null ? "" : s.rating[0]) + "–" + (s.rating[1] == null ? "" : s.rating[1]));
      if (s.interview_only === false) parts.push("不限面試常見題");
      if (s.statement !== "interview") parts.push("LeetCode 原題");
      return "Coding：" + parts.join(" · ");
    }
    return s.mode === "drill" ? (s.coach ? "教練：" : "專項：") + s.topic : "完整面試";
  }

  function failed(message) {
    var box = document.getElementById("trend");
    box.replaceChildren(el("p", "empty", "讀不到練習進度：" + message));
    var back = el("a", null, "回到設定頁");
    back.href = "/";
    box.append(back);
    document.getElementById("table").replaceChildren(el("p", "empty", "—"));
  }

  fetch("/api/progress?interview=" + encodeURIComponent(interview) + "&kind=" + kind).then(function (r) {
    return r.json().catch(function () { return {}; }).then(function (j) {
      if (!r.ok) throw new Error(j.detail || "伺服器回應 " + r.status);
      return j;
    });
  }).catch(function (err) {
    failed(err.message === "Failed to fetch" ? "連不上伺服器，bot.py 還在執行嗎？" : err.message);
    return null;
  }).then(function (d) {
    if (!d) return;
    document.getElementById("heading").textContent = "練習進度 · " + d.company + " · " + (kind === "coding" ? "Coding 面試" : d.round);
    var other = document.getElementById("kind-link");
    if (kind === "coding" || d.coding_sessions) {
      other.hidden = false;
      other.textContent = kind === "coding" ? "看面試的進度 →" : "看 Coding 面試的進度（" + d.coding_sessions + " 場）→";
      other.href = "/progress?interview=" + encodeURIComponent(interview) + (kind === "coding" ? "" : "&kind=coding");
    }
    var trend = document.getElementById("trend");
    var tableBox = document.getElementById("table");
    if (!d.sessions.length) {
      trend.append(el("p", "empty", "還沒有分數。完成一場面試、或在設定頁按「產生報告」之後，這裡就會出現。"));
      tableBox.append(el("p", "empty", "—"));
      return;
    }
    var areas = d.areas.slice();
    d.sessions.forEach(function (s) {
      (s.areas || []).forEach(function (a) { if (areas.indexOf(a.name) < 0) areas.push(a.name); });
    });
    function scoreOf(s, area) {
      var hit = (s.areas || []).find(function (a) { return a.name === area; });
      return hit ? hit.score : null;
    }

    areas.forEach(function (area) {
      var values = d.sessions.map(function (s) { return scoreOf(s, area); });
      var known = values.filter(function (v) { return v != null; });
      var row = el("div", "trend-row");
      row.append(el("span", null, area), sparkline(values), scoreChip(known.length ? known[known.length - 1] : null));
      trend.append(row);
    });

    var table = el("table");
    var head = el("tr");
    ["日期", "形式", "判定"].concat(areas).concat(["下次重點", ""]).forEach(function (t) { head.append(el("th", null, t)); });
    table.append(head);
    d.sessions.slice().reverse().forEach(function (s) {
      var tr = el("tr");
      tr.append(el("td", "meta", s.started));
      tr.append(el("td", null, modeLabel(s.session)));
      tr.append(el("td", null, verdicts[s.verdict] || s.verdict || "—"));
      areas.forEach(function (a) { var td = el("td"); td.append(scoreChip(scoreOf(s, a))); tr.append(td); });
      tr.append(el("td", "meta", (s.next_focus || []).join("；")));
      var link = el("a", null, "報告");
      link.href = "/report?interview=" + encodeURIComponent(interview) + "&file=" + encodeURIComponent(s.file);
      var td = el("td"); td.append(link); tr.append(td);
      table.append(tr);
    });
    tableBox.append(table);
  });
})();
</script>
</body>
</html>
