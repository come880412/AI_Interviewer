<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>面試中</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  html, body { height: 100%; }
  body { display: grid; grid-template-rows: minmax(0, 1fr) auto; background: #0e1116; color: #e6e9ee; }
  .stage { position: relative; min-height: 0; background: radial-gradient(ellipse at 50% 35%, #2a3342 0%, #151a22 60%, #0e1116 100%); overflow: hidden; }
  #avatar { position: absolute; inset: 0; }
  .placeholder { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: #9aa4b2; font-size: 15px; }
  .nameplate { position: absolute; left: 16px; top: 16px; background: rgba(10, 13, 18, 0.72); border-radius: 8px; padding: 8px 12px; font-size: 14px; line-height: 1.4; backdrop-filter: blur(4px); max-width: 280px; }
  .nameplate b { display: block; font-size: 15px; }
  .nameplate span { color: #b3bccb; font-size: 12px; }
  .speaking-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #3a4352; margin-right: 6px; vertical-align: middle; transition: background 0.15s; }
  .speaking-dot.on { background: #52d48a; box-shadow: 0 0 8px #52d48a; }
  .captions { position: absolute; left: 50%; transform: translateX(-50%); bottom: 16px; width: min(860px, calc(100% - 32px)); display: grid; gap: 6px; pointer-events: none; }
  .caption { background: rgba(10, 13, 18, 0.8); border-radius: 8px; padding: 6px 12px; font-size: 17px; line-height: 1.45; }
  .caption small { display: block; color: #8f99a8; font-size: 11px; letter-spacing: 0.04em; }
  .caption.you { font-size: 14px; color: #c9d1dc; }
  .caption .listening { color: #8f99a8; font-style: italic; }
  .pause-overlay { position: absolute; inset: 0; background: rgba(9, 12, 17, 0.72); backdrop-filter: blur(3px); display: grid; place-items: center; text-align: center; }
  .pause-overlay h2 { font-size: 26px; color: #e6e9ee; margin: 0 0 6px; letter-spacing: 0; }
  .pause-overlay p { color: #9aa4b2; margin: 0 0 18px; }
  .pause-overlay button { padding: 12px 28px; font-size: 16px; }
  .controls { background: #151a22; border-top: 1px solid #262e3a; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
  .controls .group { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .controls a { color: #8ca5ff; font-size: 14px; }
  .controls label { color: #9aa4b2; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
  #status { font-size: 13px; color: #9aa4b2; }
  #status.live { color: #52d48a; }
  #status.error { color: #ff8d82; }
  .meter { width: 70px; height: 6px; background: #262e3a; border-radius: 3px; overflow: hidden; }
  .meter i { display: block; height: 100%; width: 0; background: #52d48a; transition: width 0.08s; }
  button.ghost { background: transparent; border: 1px solid #3a4352; color: #e6e9ee; padding: 8px 14px; }
  button.ghost.active { background: #b3261e; border-color: #b3261e; }
  input[type="range"] { width: 110px; accent-color: #8ca5ff; }
  #delay-value { font-variant-numeric: tabular-nums; min-width: 52px; }
  @media (max-width: 760px) { .captions { bottom: 96px; } .nameplate { max-width: calc(100% - 32px); } }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js/+esm",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/",
    "talkinghead": "https://cdn.jsdelivr.net/npm/@met4citizen/talkinghead@1.8.1/modules/talkinghead.mjs",
    "headaudio": "/static/vendor/headaudio/headaudio.min.mjs"
} }
</script>
</head>
<body>
<div class="stage">
  <div id="avatar"></div>
  <div class="placeholder" id="placeholder">載入虛擬面試官…</div>
  <div class="nameplate" id="nameplate" hidden>
    <b><i class="speaking-dot" id="speaking-dot"></i><span id="who"></span></b>
    <span id="who-sub"></span>
  </div>
  <div class="captions" aria-live="polite">
    <div class="caption" id="cap-bot" hidden><small>面試官</small><span id="cap-bot-text"></span></div>
    <div class="caption you" id="cap-you" hidden><small>系統聽到你說</small><span id="cap-you-text"></span></div>
  </div>
  <div class="pause-overlay" id="pause-overlay" hidden>
    <div>
      <h2>面試已暫停</h2>
      <p id="pause-info">計時已停止，麥克風不會收音。</p>
      <button type="button" id="resume-big">繼續面試</button>
    </div>
  </div>
</div>
<div class="controls">
  <div class="group">
    <button type="button" id="connect">開始面試</button>
    <button type="button" class="ghost" id="pause" disabled>暫停</button>
    <button type="button" class="ghost" id="mute" disabled>麥克風靜音</button>
    <span class="meter" title="你的麥克風音量"><i id="meter"></i></span>
    <span id="status">準備好就按「開始面試」。請戴耳機。</span>
  </div>
  <div class="group">
    <label title="聲音延遲多少再播放，讓嘴型和聲音對齊。嘴型比聲音慢就調大，比聲音快就調小。">嘴型延遲
      <input type="range" id="delay" min="0" max="300" step="10" value="100"><span id="delay-value">100 ms</span></label>
    <label><input type="checkbox" id="show-captions" checked> 字幕</label>
    <a href="/notepad" target="_blank" rel="noopener">共用筆記板</a>
    <a href="/client/" id="voice-only">純語音頁</a>
    <a href="/">設定頁</a>
    <button type="button" class="ghost" id="end" disabled>結束並產生報告</button>
  </div>
</div>

<script type="module">
const $ = (id) => document.getElementById(id);
const statusEl = $("status");
let head = null;          // TalkingHead instance, or null when the avatar could not load
let headaudio = null;     // HeadAudio lip-sync node
let audioCtx = null;
let pc = null;
let micStream = null;
let delayNode = null;     // delays the interviewer's voice so the lips can keep up
let outputGain = null;    // mutes the interviewer's voice while paused
let voiceLevel = null;    // analyser on the voice as it is heard, for captions
let ended = false;
let endRequested = false; // the candidate pressed "end", so a dropped connection is expected
let paused = false;

function setStatus(text, cls = "") {
  statusEl.textContent = text;
  statusEl.className = cls;
}

function store(key, value) { try { localStorage.setItem(key, value); } catch {} }
function recall(key) { try { return localStorage.getItem(key); } catch { return null; } }

// ----- Interviewer info and avatar -----
const view = await fetch("/api/interview-view").then((r) => r.ok ? r.json() : null).catch(() => null);
if (view) {
  $("who").textContent = view.interviewer_name;
  const mode = view.session.mode === "drill" ? `${view.session.coach ? "教練模式" : "專項練習"}：${view.session.topic}` : (view.resuming ? "接續面試" : view.round);
  $("who-sub").textContent = `${view.interviewer_title}, ${view.company} · ${mode}`;
  $("nameplate").hidden = false;
  document.title = `面試中 · ${view.company}`;
}

async function loadAvatar() {
  if (!view || !view.avatar_url) {
    $("placeholder").textContent = "沒有頭像檔。執行 python download_models.py avatar 下載後重新整理；現在仍可用純語音面試。";
    return;
  }
  try {
    const { TalkingHead } = await import("talkinghead");
    head = new TalkingHead($("avatar"), {
      ttsEndpoint: "N/A",          // no TTS: the voice comes from the interview server
      lipsyncModules: [],
      cameraView: "upper",
      cameraRotateEnable: false,
      cameraPanEnable: false,
      cameraZoomEnable: false,
    });
    await head.showAvatar({
      url: view.avatar_url,
      body: view.avatar_body,
      avatarMood: "neutral",
      avatarIdleEyeContact: 0.4,
      avatarListeningEyeContact: 0.8,
      avatarSpeakingEyeContact: 0.6,
    }, (ev) => {
      if (ev.lengthComputable) $("placeholder").textContent = `載入虛擬面試官… ${Math.round(ev.loaded / ev.total * 100)}%`;
    });
    $("placeholder").hidden = true;
    audioCtx = head.audioCtx;
    if (view.lipsync_ready) await setupLipSync();
  } catch (err) {
    console.error(err);
    head = null;
    $("placeholder").textContent = `虛擬面試官載入失敗（${err.message}）。仍可用純語音面試。`;
  }
}

async function setupLipSync() {
  try {
    const { HeadAudio } = await import("headaudio");
    await audioCtx.audioWorklet.addModule("/static/vendor/headaudio/headworklet.min.mjs");
    headaudio = new HeadAudio(audioCtx, {
      processorOptions: {},
      parameterData: { vadGateActiveDb: -40, vadGateInactiveDb: -60 },
    });
    await headaudio.loadModel("/static/vendor/headaudio/model-en-mixed.bin");
    headaudio.onvalue = (key, value) => {
      Object.assign(head.mtAvatar[key], { newvalue: value, needsUpdate: true });
    };
    head.opt.update = headaudio.update.bind(headaudio);
    // Eye contact, and now and then a small hand gesture, when a new sentence starts.
    let lastEnded = 0;
    headaudio.onended = () => { lastEnded = Date.now(); };
    headaudio.onstarted = () => {
      if (Date.now() - lastEnded > 150) {
        head.lookAtCamera(500);
        if (Math.random() < 0.3) head.speakWithHands();
      }
    };
  } catch (err) {
    console.error(err);
    headaudio = null;
    setStatus(`嘴型同步載入失敗（${err.message}），面試官不會動嘴。`, "error");
  }
}

await loadAvatar();

// ----- Lip-sync delay -----
const savedDelay = Number(recall("lipsync-delay-ms"));
if (Number.isFinite(savedDelay) && recall("lipsync-delay-ms") !== null) $("delay").value = String(savedDelay);
function applyDelay() {
  const ms = Number($("delay").value);
  $("delay-value").textContent = `${ms} ms`;
  if (delayNode) delayNode.delayTime.value = headaudio ? ms / 1000 : 0;
}
$("delay").addEventListener("input", () => { applyDelay(); store("lipsync-delay-ms", $("delay").value); });
applyDelay();

// ----- Captions -----
// Each sentence arrives as a "bot-output" message (spoken_status "new") when the server starts on it, before or as
// the voice begins. Words are revealed only while the interviewer's voice is actually audible, at a speaking
// pace, so the caption follows the speech instead of jumping ahead or lagging a sentence behind.
// Chinese is revealed a character at a time and English a word at a time, each at its own speaking pace.
const WORDS_PER_SECOND = 2.5;
const CHINESE_CHARS_PER_SECOND = 4.5;
const CJK = "\\u3400-\\u9fff\\uf900-\\ufaff", CJK_PUNCT = "\\u3000-\\u303f\\uff00-\\uffef";
// A unit is one Chinese character with any punctuation after it, or one run of other non-space text.
const UNIT = new RegExp(`[${CJK}][${CJK_PUNCT}]*|[^\\s${CJK}]+`, "g");
// Spaces only between English words and between English and Chinese, as in chinese.py's tidy_spaces.
const CJK_SPACE = new RegExp(`(?<=[${CJK_PUNCT}]) +| +(?=[${CJK_PUNCT}])|(?<=[${CJK}]) +(?=[${CJK}])`, "g");
const CAPTION_WIDTH = 200;  // about two lines, a Chinese character counting as two letters
function units(text) { return text.match(UNIT) || []; }
function isChinese(unit) { return new RegExp(`^[${CJK}]`).test(unit); }
function unitWidth(unit) { return isChinese(unit) ? 2 * unit.length : unit.length + 1; }
// The last units that fit in the caption, joined with spaces only between English words.
function captionText(list) {
  let width = 0, start = list.length;
  while (start > 0 && width + unitWidth(list[start - 1]) <= CAPTION_WIDTH) width += unitWidth(list[--start]);
  return list.slice(start).join(" ").replace(CJK_SPACE, "");
}
let botWords = [];      // every unit (word or Chinese character) of the interviewer's current turn
let botShown = 0;       // how many of them are on screen (fractional while revealing)
let youSegments = [];   // the candidate's transcribed pieces of the current answer
let youListening = false;
let lastSpeaker = "bot";

function captionsOn() { return $("show-captions").checked && !paused; }

function renderBotCaption() {
  const text = captionText(botWords.slice(0, Math.floor(botShown)));
  $("cap-bot").hidden = !text || !captionsOn();
  $("cap-bot-text").textContent = text;
}

function renderYouCaption() {
  const text = captionText(units(youSegments.join(" ")));
  $("cap-you").hidden = (!text && !youListening) || !captionsOn();
  const span = $("cap-you-text");
  span.replaceChildren(document.createTextNode(text ? text + " " : ""));
  if (youListening) {
    const l = document.createElement("span");
    l.className = "listening";
    l.textContent = text ? "…" : "聆聽中…";
    span.append(l);
  }
}

$("show-captions").addEventListener("change", () => { renderBotCaption(); renderYouCaption(); });

const levelBuf = new Float32Array(1024);
function voiceAudible() {
  if (!voiceLevel) return true;  // no analyser: reveal at the speaking pace
  voiceLevel.getFloatTimeDomainData(levelBuf);
  let sum = 0;
  for (const x of levelBuf) sum += x * x;
  return Math.sqrt(sum / levelBuf.length) > 0.01;
}

let lastTick = performance.now();
(function captionTick(t) {
  const dt = (t - lastTick) / 1000;
  lastTick = t;
  if (botShown < botWords.length && voiceAudible()) {
    const pace = isChinese(botWords[Math.floor(botShown)]) ? CHINESE_CHARS_PER_SECOND : WORDS_PER_SECOND;
    botShown = Math.min(botWords.length, botShown + dt * pace);
    renderBotCaption();
  }
  if (!ended) requestAnimationFrame(captionTick);
})(performance.now());

function onServerMessage(raw) {
  let msg;
  try { msg = JSON.parse(raw); } catch { return; }
  if (msg.label !== "rtvi-ai") return;
  switch (msg.type) {
    case "bot-llm-started":
      // A new interviewer turn: start a fresh caption, and the candidate's next answer starts fresh too.
      botWords = [];
      botShown = 0;
      lastSpeaker = "bot";
      renderBotCaption();
      break;
    case "bot-output": {
      // "new" marks a sentence the voice is about to speak; "completed" repeats it after synthesis.
      if (msg.data?.spoken_status !== "new") break;
      const text = (msg.data.text || "").replace(/\[\[\s*END\s*\]\]/g, "").trim();
      if (text) botWords.push(...units(text));
      break;
    }
    case "bot-interrupted":
      botWords = botWords.slice(0, Math.floor(botShown));  // drop what was never said
      renderBotCaption();
      break;
    case "bot-started-speaking":
      $("speaking-dot").classList.add("on");
      break;
    case "bot-stopped-speaking":
      $("speaking-dot").classList.remove("on");
      botShown = botWords.length;  // the voice finished: show the rest
      renderBotCaption();
      break;
    case "user-started-speaking":
      if (lastSpeaker === "bot") youSegments = [];
      lastSpeaker = "you";
      youListening = true;
      renderYouCaption();
      if (head) head.lookAtCamera(1500);
      break;
    case "user-stopped-speaking":
      youListening = false;
      renderYouCaption();
      break;
    case "user-transcription":
      // Each pause in an answer yields one transcribed piece; keep them all for this answer.
      if (msg.data?.final && msg.data.text?.trim()) {
        youSegments.push(msg.data.text.trim());
        renderYouCaption();
      }
      break;
  }
}

// ----- Microphone level meter -----
function startMeter(stream) {
  const ctx = audioCtx || new AudioContext();
  const analyser = ctx.createAnalyser();
  analyser.fftSize = 512;
  ctx.createMediaStreamSource(stream).connect(analyser);
  const buf = new Float32Array(analyser.fftSize);
  (function tick() {
    analyser.getFloatTimeDomainData(buf);
    let sum = 0;
    for (const x of buf) sum += x * x;
    const level = Math.min(1, Math.sqrt(sum / buf.length) * 6);
    const live = micStream && micStream.getAudioTracks()[0].enabled;
    $("meter").style.width = (live ? level * 100 : 0) + "%";
    if (!ended) requestAnimationFrame(tick);
  })();
}

// ----- Interviewer audio: to the speakers (delayed) and to the lip-sync -----
function playRemote(stream) {
  // Chrome only feeds a remote WebRTC stream into Web Audio if a media element also holds it.
  const keepAlive = new Audio();
  keepAlive.srcObject = stream;
  keepAlive.muted = true;
  keepAlive.play().catch(() => {});

  if (!audioCtx) audioCtx = new AudioContext();
  const source = audioCtx.createMediaStreamSource(stream);
  delayNode = new DelayNode(audioCtx, { delayTime: 0, maxDelayTime: 1 });
  outputGain = new GainNode(audioCtx, { gain: paused ? 0 : 1 });
  voiceLevel = audioCtx.createAnalyser();
  voiceLevel.fftSize = 1024;
  source.connect(delayNode).connect(outputGain).connect(audioCtx.destination);
  outputGain.connect(voiceLevel);  // what you hear drives the caption pace
  if (headaudio) source.connect(headaudio);
  applyDelay();
}

// ----- Pause -----
function showPaused(isPaused) {
  paused = isPaused;
  $("pause-overlay").hidden = !paused;
  $("pause").textContent = paused ? "繼續面試" : "暫停";
  const track = micStream && micStream.getAudioTracks()[0];
  if (track && !$("mute").classList.contains("active")) track.enabled = !paused;
  if (outputGain) outputGain.gain.value = paused ? 0 : 1;
  setStatus(paused ? "已暫停" : "面試進行中", paused ? "" : "live");
  renderBotCaption();
  renderYouCaption();
}

async function togglePause() {
  $("pause").disabled = true;
  $("resume-big").disabled = true;
  try {
    const r = await fetch(paused ? "/api/session/resume" : "/api/session/pause", { method: "POST" });
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail);
    showPaused(j.paused);
  } catch (err) {
    setStatus(err.message, "error");
  } finally {
    $("pause").disabled = false;
    $("resume-big").disabled = false;
  }
}
$("pause").addEventListener("click", togglePause);
$("resume-big").addEventListener("click", togglePause);

// Keep in step when the interview is paused or resumed from the setup page.
async function syncPause() {
  if (ended || !pc) return;
  try {
    const s = await fetch("/api/status").then((r) => r.json());
    if (s.active && s.active.paused !== paused) showPaused(s.active.paused);
    if (s.active && s.active.paused) {
      $("pause-info").textContent = `計時已停止（已進行約 ${Math.round(s.active.elapsed / 60)} 分鐘），麥克風不會收音。`;
    }
  } catch {}
}
setInterval(syncPause, 3000);

// ----- Connection (Pipecat SmallWebRTC) -----
async function connect() {
  $("connect").disabled = true;
  setStatus("連線中…");
  try {
    if (!audioCtx) audioCtx = new AudioContext();
    await audioCtx.resume();
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
    });
    startMeter(micStream);

    pc = new RTCPeerConnection();
    // The server reads the first transceiver as audio and the second as camera video.
    pc.addTransceiver(micStream.getAudioTracks()[0], { direction: "sendrecv" });
    pc.addTransceiver("video", { direction: "sendrecv" });
    const channel = pc.createDataChannel("rtvi");
    channel.onopen = () => channel.send(JSON.stringify({
      label: "rtvi-ai", type: "client-ready", id: crypto.randomUUID(),
      data: { version: "2.1.0", about: { library: "interview-avatar-page" } },
    }));
    channel.onmessage = (e) => onServerMessage(e.data);

    pc.ontrack = (e) => {
      if (e.track.kind === "audio") playRemote(e.streams[0] || new MediaStream([e.track]));
    };
    pc.onconnectionstatechange = () => {
      const s = pc.connectionState;
      if (s === "connected") {
        setStatus("面試進行中", "live");
        $("pause").disabled = false;
        $("mute").disabled = false;
        $("end").disabled = false;
      } else if (s === "failed" || s === "disconnected" || s === "closed") {
        const goodbye = /bye|take care|thank/i.test(botWords.join(" "));
        finish(s === "failed" && !endRequested && !goodbye ? "連線中斷，可回設定頁接續這場面試。" : null);
      }
    };

    await pc.setLocalDescription(await pc.createOffer());
    await iceGathered(pc);
    const answer = await fetch("/api/offer", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sdp: pc.localDescription.sdp, type: pc.localDescription.type }),
    }).then((r) => { if (!r.ok) throw new Error(`伺服器回應 ${r.status}`); return r.json(); });
    await pc.setRemoteDescription({ sdp: answer.sdp, type: answer.type });
  } catch (err) {
    console.error(err);
    setStatus(`無法開始：${err.message}`, "error");
    cleanup();
    $("connect").disabled = false;
  }
}

function iceGathered(peer) {
  return new Promise((resolve) => {
    if (peer.iceGatheringState === "complete") return resolve();
    const done = () => { if (peer.iceGatheringState === "complete") resolve(); };
    peer.addEventListener("icegatheringstatechange", done);
    setTimeout(resolve, 3000);  // localhost needs no more than host candidates
  });
}

function cleanup() {
  if (micStream) micStream.getTracks().forEach((t) => t.stop());
  if (pc) pc.close();
  pc = null;
}

function finish(message) {
  if (ended) return;
  ended = true;
  cleanup();
  paused = false;
  $("pause-overlay").hidden = true;
  $("speaking-dot").classList.remove("on");
  ["pause", "mute", "end"].forEach((id) => { $(id).disabled = true; });
  $("connect").hidden = true;
  setStatus(message || "面試已結束。回饋報告約一分鐘內產生，可到設定頁查看。");
}

$("connect").addEventListener("click", connect);

$("mute").addEventListener("click", () => {
  const track = micStream && micStream.getAudioTracks()[0];
  if (!track) return;
  const muting = !$("mute").classList.contains("active");
  $("mute").classList.toggle("active", muting);
  $("mute").textContent = muting ? "取消靜音" : "麥克風靜音";
  track.enabled = !muting && !paused;
});

let endArmed = false;
$("end").addEventListener("click", async () => {
  if (!endArmed) {
    endArmed = true;
    $("end").textContent = "確定結束？再按一次";
    setTimeout(() => { endArmed = false; if (!ended) $("end").textContent = "結束並產生報告"; }, 4000);
    return;
  }
  $("end").disabled = true;
  endRequested = true;
  try {
    const r = await fetch("/api/session/end", { method: "POST" });
    if (!r.ok) throw new Error((await r.json()).detail);
    setStatus("結束中…");
  } catch (err) {
    setStatus(err.message, "error");
    $("end").disabled = false;
  }
});

window.addEventListener("beforeunload", cleanup);
</script>
</body>
</html>
